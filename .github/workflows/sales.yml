name: sales
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/polar-sales.js
        env:
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_ORG_ID: ${{ secrets.POLAR_ORG_ID }}
      - name: Commit ledger if changed
        run: |
          git config user.name "knackdesk-bot"
          git config user.email "bot@knackdesk.com"
          git add pipeline/LEDGER.md
          git diff --cached --quiet || git commit -m "chore: refresh sales ledger [skip ci]"
          git push
